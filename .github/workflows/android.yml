name: Build Android APK

on:
  push:
    branches: [main, android-wip]
    paths-ignore: ['tests/**']
  workflow_dispatch:

permissions:
  contents: write   # publish the APK as a release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Runners ship with the Android SDK; just accept licences so Gradle can fetch the platform it needs.
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Android only installs an APK as an UPDATE when it is signed with the same key.
      # Keep one debug key across builds so new APKs install over the old app without losing data.
      - name: Restore signing key
        id: key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Stage web assets
        run: |
          mkdir www
          cp -r index.html privacypolicy.html manifest.json sw.js css js data icons www/

      - name: Create Android project
        run: npx cap add android

      # Permanent signing key (GitHub secrets). Without it the build falls back to a temporary debug key.
      - name: Prepare release signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASSWORD" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass "$KS_PASSWORD" 2>/dev/null | awk -F', ' '/PrivateKeyEntry/{print $1; exit}')
            if [ -z "$ALIAS" ]; then echo "Could not read the key alias from the keystore"; exit 1; fi
            echo "KS_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "KS_PASS=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No signing secrets found: using the debug key"
          fi

      - name: Patch Android project (minSdk 26 for Health Connect, version numbers)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 scripts/patch-android.py

      - name: Generate launcher icons and splash
        run: npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#0b0d10' --splashBackgroundColor '#0b0d10'

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          if [ "$SIGNED" = "true" ]; then ./gradlew assembleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi

      - name: Save signing key
        if: steps.key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Name the APK
        run: |
          if [ "$SIGNED" = "true" ]; then cp android/app/build/outputs/apk/release/app-release.apk athletic-coach.apk; else cp android/app/build/outputs/apk/debug/app-debug.apk athletic-coach.apk; fi

      - uses: actions/upload-artifact@v4
        with:
          name: athletic-coach-apk
          path: athletic-coach.apk
          retention-days: 30
          if-no-files-found: error

      # Direct-download link (no GitHub login needed): Releases > "apk-latest"
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Athletic Coach APK (latest build)
          body: Latest debug build. Install over the existing app to keep your data.
          prerelease: true
          files: athletic-coach.apk
