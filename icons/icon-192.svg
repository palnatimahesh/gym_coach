<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="36" fill="#0a0a0f"/>
  <rect width="192" height="192" rx="36" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e84393;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0.08"/>
    </linearGradient>
  </defs>
  <!-- Dumbbell icon centered -->
  <g transform="translate(96,96)" stroke="white" stroke-width="8" stroke-linecap="round" fill="none">
    <!-- Bar -->
    <line x1="-32" y1="0" x2="32" y2="0"/>
    <!-- Left plates -->
    <line x1="-40" y1="-20" x2="-40" y2="20"/>
    <line x1="-50" y1="-28" x2="-50" y2="28"/>
    <!-- Right plates -->
    <line x1="40" y1="-20" x2="40" y2="20"/>
    <line x1="50" y1="-28" x2="50" y2="28"/>
    <!-- Grips -->
    <line x1="-32" y1="-12" x2="-32" y2="12" stroke="#e84393" stroke-width="10"/>
    <line x1="32" y1="-12" x2="32" y2="12" stroke="#e84393" stroke-width="10"/>
  </g>
  <!-- AC text -->
  <text x="96" y="148" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#e84393" letter-spacing="4">ATHLETIC</text>
</svg>
